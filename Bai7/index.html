<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 7</title>
</head lang="en">
<body>
    <!-- Internal JavaScript -->
    <script>
        // Có thể để mã nguồn html trong java 
        // Lưu ý: html phải đặt trong dấu ""
        document.writeln("Hello World");

        var tenSingVien = "Duy Tung";
        var tuoi = 21;
        document.writeln(tenSingVien + "<br>" + tuoi + "<br>")

        var soThuNhat = 10;
        var soThuHai = 5;
        // + - *
        // % chia lấy phần dư
        var ketQua = soThuNhat / soThuHai ;
        document.writeln("Kết quả là: " + ketQua);

        // ++ --
        document.writeln(++soThuNhat);
        document.writeln(--soThuNhat);

        // += -= /= %=
        // Tương đương: soThuNhat = soThuNhat + soThuHai
        soThuNhat+=soThuHai;
        document.writeln(soThuNhat);

        // Kiểu dữ liệu
        // string
        // Number Số
        // boolean (true/false)

        var a = "10" ;
        var b = "5.5" ;
        // Chuyển string => number dùng: parseInt()
        var tong = parseInt(a) + parseFloat(b);
        document.writeln(tong);

        //String
        document.writeln("<br>")
        // Kiểm tra độ dài chuỗi length 
        document.writeln(tenSingVien.length)
        // Nối chuỗi +

        // Kiểm tra tồn tại
        //indexOF
        document.writeln("<br>")
        document.writeln(tenSingVien.indexOf("u"));

        // includes kiểm tra xem từ có trong chuỗi không? Có true: Ko False n
        document.writeln("<br>")
        document.writeln(tenSingVien.includes("u"));

        // replace (thay thế chuỗi)
        document.writeln("<br>")
        document.writeln(tenSingVien.replace("Duy","Hoàng"));

        // Kiểm tra ký tự bắt đầu
        // startsWith
        document.writeln("<br>")
        document.writeln(tenSingVien.startsWith("Duy"));

        // Viết in Hoa
        document.writeln("<br>")
        document.writeln(tenSingVien.toUpperCase());

        // Viết in thường
        document.writeln("<br>")
        document.writeln(tenSingVien.toLowerCase());

        //Number
        // Kiểm tra dữ liệu có phải số không
        document.writeln(isNaN)

        //Date
        var homNay = new Date();
        document.writeln("<br>");
        document.writeln(homNay);

        
        var ngay = new Date(10/20/2026);
        document.writeln("<br>");
        document.writeln(ngay);

        //Lấy năm
        var nam = homNay.getFullYear();
        document.writeln("<br>");
        document.writeln(nam);

        //Lấy tháng
        var thang = homNay.getMonth();
        document.writeln("<br>");
        document.writeln(thang);

        //Lấy ngày
        var ngay = homNay.getDate();
        document.writeln("<br>");
        document.writeln(ngay);

        //Lấy thứ
        var thu = homNay.getDay();
        document.writeln("<br>");
        document.writeln(thu);

        var namSinhTung = nam - tuoi;
        document.writeln("<br>");
        document.writeln("Tùng sinh năm " + namSinhTung);

        // mảng (array)
        var mangSo = [1,2,3,4,5];
        var mangTen = ["Tung","Viet","Tuan"];
        var thongTin = ["Tung",21,false];

        document.writeln("<br>");
        document.writeln(mangSo[2]);

        document.writeln("<br>");
        document.writeln(mangTen[1]);

        document.writeln("<br>");
        document.writeln(thongTin[1]);

        //Kiểm tra đppj dài mảng length
        document.writeln("<br>");
        document.writeln(mangSo.length);

        //Gộp mảng concat
        var mang = mangSo.concat(mangTen, thongTin);
        document.writeln(mang);

        //join các phần tử ngăn cách nhau bằng dấu gạch ngang
        document.writeln("<br>");
        document.writeln(mangSo.join("-"));

        //pop lấy ra số cuối cùng
        document.writeln("<br>");
        document.writeln(mangSo.pop());

        //push thêm phần tử
        document.writeln("<br>");
        mangSo.push(6)
        document.writeln(mangSo);

        //reverse
        document.writeln("<br>")
        document.writeln(mangSo.reverse());

        // var soThuNhat = 10
        // var soThuNhat = 5
        // == so sánh bằng
        // != so sánh khác
        // >
        // <
        // >=
        // <=
        document.writeln("<br>")
        document.writeln(soThuNhat <= 15);
        // &&
        var c = 10
        var d = 5.5
        // true & true = true
        // true & false = false
        // false & false
        document.writeln("<br>")
        document.writeln((soThuNhat > soThuHai) && (c > d));

        //true || false =
        document.writeln("<br>")
        document.writeln((soThuNhat > soThuHai) || (c < d));

        if (thu == 5){
            document.writeln("<br>" + "Hôm nay là thứ 6")
        }
        else{
            document.writeln("<br>" + "Hôm nay không phải là thứ 6")
        }

        var Diem = 7;
        if (Diem <= 4){
            document.writeln("<br>" + "Trượt")
        }
        else{
            document.writeln("<br>" + "Qua")
        }
        // điểm 
        if (Diem < 4){
            document.writeln("<br>" + "F")
        }
        else if(Diem < 5 && Diem >=4){
            document.writeln("<br>" + "D")
        }
        else if(Diem < 7 && Diem >=5){
            document.writeln("<br>" + "C")
        }
        else if(Diem < 8 && Diem >=7){
            document.writeln("<br>" + "B")
        }
        else if(Diem < 10 && Diem >=8){
            document.writeln("<br>" + "A")
        }
        else{
            document.writeln("<br>" + "Điểm không hợp lệ")
        }
    </script>
    <!-- external JS -->
    <!-- <scriptsrc="script.jt"></script> -->
</body>
</html>
