<html>
    <head>
        <title></title>
    </head>
    <body>
        <marquee>
            <img src="../anh/td.png">
        </marquee>
        <!-- ol: Danh sach ko thu tu -->
        <ol>
            <li>C#</li>
            <li>python</li>
            <li>JavaScript</li>
        </ol>
        
        <ul>
            <li>C#</li>
            <li>python</li>
            <li>JavaScript</li>
        </ul>        
        
        
        <hl>Form đang ký</hl>
        <form>
            <div>
                <b>Họ và tên</b><br>
                <!-- nếu input không có type thì mặc định là text -->
                <!-- Thuộc tính readonly sử dụng khi không muốn người đang nhập thông tin vào input  -->
                <input type="text" placeholder="Họ và tên">
            </div>
            <div>
                <b>Năm sinh</b><br>
                <input type="number" placeholder="Năm sinh">
            </div>
            <div>
                <b>Mật khẩu</b><br>
                <input type="password" placeholder="Mật khẩu">
            </div>
            <div>
                <b>Giới thiệt về bản thân</b><br>
                <textarea>Nhập thông tin...</textarea>
            </div>
            <div>
                <b>Email</b><br>
                <input type="Email" placeholder="Email">
            </div>
            <div>
                <b>Số điện thoại</b><br>
                <input type="tel" pattern="([0]{1}([3,8,9]{1})([0-9]{8}))">
            </div>
            <div>
                <b>Giới tính</b><br>
                <input type="radio" name="gioitinh" value="nam"> Nam <br>
                <input type="radio" name="gioitinh" value="nu"> Nữ
            </div>
            <div>
                <b>Sở thích</b><br>
                Chơi game: <input type="checkbox" name="sothich" value="Choigame"> <br>
                Nghe nhạc: <input type="checkbox" name="sothich" value="Nghenhac"> <br>
                Thể thao: <input type="checkbox" name="sothich" value="Thethao"> <br>
            </div>
            <div>
                <b>Trình duyệt web yêu thích</b><br>
                <select name="browsers">
                    <option value="Internet Explorer">Internet Explorer</option>
                    <option value="Fire Fox">Fire Fox</option>
                    <option value="Chrome">Chrome</option>
                    <option value="Opera">Opera</option>
                    <option value="Safari">Safari</option>
                    <option value="Cốc cốc">Cốc cốc</option>
                </select>
            </div>
            <div>
            0 <input type="range" id="a" value="50"> 100 
            </div>
            <div>
                <input type="submit">
                <button>Xác nhận</button>
                <input type="reset">
            </div>
            <div>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/uU0FDeBj6u8?si=jmBhTWhz83Kz0UtL" title="YouTube video player"allowfullscreen> 
                </iframe>
            </div>
            <div>
            <video controls width="560" height="315"> <br>
                <source src="/anh/fd.mp4" type ="video/mp4"> 
            </video>
            </div>
            <div>
            <audio controls>
                <source src="/anh/spak.mp3" type="audio/mp3"> 
            </audio>
            </div>
        </form>
    </body>
</html>
