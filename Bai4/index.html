<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>
    <style>
        h2{
            color:pink;
            background-color: black;
        }
        h3{
            color: white;
            background-color: brown;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Cách 1: Inline style  -->
    <!-- color: Quy định màu chữ -->
    <!-- background-color: Quy định màu nền -->
    <h1 style="color: blue; background-color: orange">Bài STYLE</h1>

    <!-- Cách 2: Internal style  -->
    <h2>Cách 2 Internal style</h2>
    <h3>Humg</h3>

    <!-- Cách 3: External style  -->
    <h4>trường tôi</h4>
</body>
</html>
